<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CotiStock</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#1c2733;--mut:#66758a;--line:#d6dde5;--acc:#0f5c6e;--acc-ink:#fff;--soft:#e3eef1;--ok:#1f7a4d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12181f;--card:#1a232d;--ink:#e6ebf0;--mut:#93a1b3;--line:#2c3947;--acc:#4fb3c8;--acc-ink:#07222a;--soft:#1e3039;--ok:#5cc891}}
:root[data-theme="dark"]{--bg:#12181f;--card:#1a232d;--ink:#e6ebf0;--mut:#93a1b3;--line:#2c3947;--acc:#4fb3c8;--acc-ink:#07222a;--soft:#1e3039;--ok:#5cc891}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "IBM Plex Sans",system-ui,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:17px;margin:0;font-weight:600;cursor:pointer;margin-right:auto}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:0;color:var(--mut);padding:7px 12px;border-radius:6px;font:inherit;cursor:pointer}
nav button.on{background:var(--soft);color:var(--acc);font-weight:600}
main{max-width:1050px;margin:0 auto;padding:22px 16px 60px}
h2{font-size:22px;margin:0 0 16px;font-weight:600}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:10px}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:26px 22px;text-align:left;cursor:pointer;color:var(--ink);font:inherit}
.mcard:hover{border-color:var(--acc)}
.mcard b{display:block;font-size:19px;margin-bottom:6px}
.mcard span{color:var(--mut);font-size:14px}
.mcard em{display:block;margin-top:14px;font-style:normal;font-size:28px;font-weight:600;color:var(--acc)}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:14px}
label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:3px}
input,select,textarea{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px 9px;font:inherit}
input:disabled,select:disabled,textarea:disabled{opacity:1;background:transparent;border-color:transparent;-webkit-text-fill-color:var(--ink)}
textarea{resize:vertical;min-height:58px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.tw{overflow-x:auto;margin-bottom:12px}
table{width:100%;border-collapse:collapse;min-width:640px}
th{text-align:left;font-size:12.5px;color:var(--mut);font-weight:500;padding:6px 6px;border-bottom:1px solid var(--line)}
td{padding:5px 4px;border-bottom:1px solid var(--line);vertical-align:top}
td.ro{padding:8px 6px}
.btn{background:var(--acc);color:var(--acc-ink);border:0;border-radius:6px;padding:8px 14px;font:inherit;font-weight:500;cursor:pointer}
.btn.ghost{background:transparent;color:var(--acc);border:1px solid var(--acc)}
.btn.sm{padding:4px 9px;font-size:13px}
.x{background:none;border:0;color:var(--mut);cursor:pointer;font-size:18px;padding:4px 8px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bar .sp{margin-left:auto}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid transparent;padding:0;cursor:pointer;flex:none;display:inline-block;vertical-align:middle}
.dot.none{background:transparent;border:1.5px dashed var(--mut)}
.dot.sel{border-color:var(--ink);box-shadow:0 0 0 2px var(--card) inset}
.dots{display:flex;gap:7px;align-items:center;flex-wrap:wrap;min-height:34px}
.tot{margin-left:auto;max-width:330px;margin-top:6px}
.tot div{display:flex;justify-content:space-between;padding:3px 0}
.tot .g{font-weight:600;font-size:18px;border-top:2px solid var(--ink);margin-top:4px;padding-top:6px}
.note{background:var(--soft);color:var(--acc);border-radius:6px;padding:6px 10px;font-size:13px;margin-top:8px;display:inline-block}
.list .it{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;flex-wrap:wrap}
.it.sold{border-left:4px solid var(--ok)}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:none;cursor:pointer;color:transparent;font-size:16px;flex:none}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.it .mid{flex:1;min-width:160px}.it small{color:var(--mut)}
.badge{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--mut)}
.badge.ok{background:var(--ok);color:var(--bg)}
.empty{color:var(--mut);text-align:center;padding:40px 10px}
#tip{position:fixed;z-index:9;background:var(--ink);color:var(--bg);padding:6px 10px;border-radius:6px;font-size:13px;display:none;pointer-events:none}
.ph{display:none}
@media print{header,.bar,.x,.noprint{display:none!important}body{background:#fff}.sheet{border:0}}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>#login{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}#login .box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:26px;width:100%;max-width:360px}#login .box>*{margin-bottom:12px}#err{color:#e5484d;font-size:13px;min-height:18px}</style>
</head>
<body>
<header><h1 onclick="go('home')">CotiStock</h1>
<nav id="nav"></nav><button class="btn ghost sm noprint" id="out" onclick="auth.signOut()" style="display:none">Salir</button></header>
<main id="app"></main>
<div id="tip"></div>
<div id="login"><div class="box"><h2 style="margin:0">CotiStock</h2><div><label>Correo de la empresa</label><input id="em" type="email" autocomplete="username"></div><div><label>Contraseña</label><input id="pw" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"></div><div id="err"></div><button class="btn" style="width:100%" onclick="doLogin()">Entrar</button></div></div>
<script>
const PAL=['#e5484d','#f5a524','#e8d44d','#30a46c','#12a594','#3e63dd','#8e4ec6','#d6409f'];
let S={quotes:[],colors:{},seq:1,tc:17.5},cur=null,view='home',inv={q:'',c:''},flt='all';
const firebaseConfig={apiKey:"PEGA_TU_API_KEY",authDomain:"PEGA_TU_PROYECTO.firebaseapp.com",projectId:"PEGA_TU_PROYECTO",appId:"PEGA_TU_APP_ID"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),fdb=firebase.firestore(),metaRef=fdb.collection('cotistock').doc('meta'),qCol=fdb.collection('quotes');
let unsub=[];
function refresh(){if(view!=='edit')render()}
function doLogin(){$('#err').textContent='';auth.signInWithEmailAndPassword($('#em').value.trim(),$('#pw').value).catch(()=>{$('#err').textContent='Correo o contraseña incorrectos.'})}
auth.onAuthStateChanged(u=>{unsub.forEach(f=>f());unsub=[];$('#login').style.display=u?'none':'flex';$('#out').style.display=u?'':'none';
if(!u){S.quotes=[];view='home';render();return}
unsub.push(metaRef.onSnapshot(s=>{if(s.exists){const d=s.data();S.colors=d.colors||{};S.seq=d.seq||1;S.tc=d.tc||17.5}refresh()},()=>{}));
unsub.push(qCol.onSnapshot(s=>{S.quotes=s.docs.map(d=>d.data());refresh()},()=>{}))});
function save(){metaRef.set({colors:S.colors,tc:S.tc},{merge:true}).catch(()=>{})}
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const pad=n=>'COT-'+String(n).padStart(4,'0');
const fm=(n,c)=>new Intl.NumberFormat('es-MX',{style:'currency',currency:c||'MXN'}).format(n||0)+' '+(c||'MXN');
function newQ(){return{id:Date.now(),num:S.seq,date:today(),vig:'15 días',para:'',dest:'',color:'',items:[{name:'',spec:'',qty:1,cost:0,cur:'MXN'}],envio:0,envioCur:'MXN',iva:16,tc:S.tc,disp:'MXN',pago:'',entrega:'',notas:'',sold:false,locked:false,saved:false}}
function conv(a,from,q){a=+a||0;if(from===q.disp)return a;return from==='MXN'?a/q.tc:a*q.tc}
function calc(q){let sub=0,cv=false;q.items.forEach(i=>{sub+=conv(i.cost,i.cur,q)*(+i.qty||0);if(i.cur!==q.disp)cv=true});
const env=conv(q.envio,q.envioCur,q);if(q.envioCur!==q.disp&&+q.envio)cv=true;const iva=sub*(+q.iva||0)/100;return{sub,env,iva,tot:sub+env+iva,cv}}
function go(v,id){view=v;if(v==='edit'){cur=id?JSON.parse(JSON.stringify(S.quotes.find(q=>q.id===id))):newQ();if(id)cur.locked=true}render();window.scrollTo(0,0)}
function render(){
$('#nav').innerHTML=[['home','Inicio'],['edit','Nueva cotización'],['sold','Cotizaciones vendidas'],['inv','Inventario']].map(([k,t])=>`<button class="${view===k?'on':''}" onclick="go('${k}')">${t}</button>`).join('');
({home:rHome,edit:rEdit,sold:rSold,inv:rInv})[view]()}
function rHome(){const v=S.quotes.filter(q=>q.sold).length;$('#app').innerHTML=`<h2>¿Qué quieres hacer hoy?</h2><div class="menu">
<button class="mcard" onclick="go('edit')"><b>1. Hoja de cotizaciones</b><span>Crea una cotización nueva con productos, envío y conversión de moneda.</span></button>
<button class="mcard" onclick="go('sold')"><b>2. Cotizaciones vendidas</b><span>Marca cuáles se vendieron, ábrelas o edítalas.</span><em>${v} de ${S.quotes.length}</em></button>
<button class="mcard" onclick="go('inv')"><b>3. Inventario</b><span>Todo lo cotizado, del más antiguo al más nuevo, con buscador y colores por cliente.</span></button></div>
<p class="noprint" style="margin-top:26px"><button class="btn ghost sm" onclick="backup()">Descargar respaldo</button> <label class="btn ghost sm" style="display:inline-block;margin:0;cursor:pointer">Importar respaldo<input type="file" accept=".json" hidden onchange="restore(this)"></label></p>`}
function dotsEdit(q){return `<div class="dots"><button class="dot none ${!q.color?'sel':''}" title="Sin color" ${q.locked?'disabled':''} onclick="setCol('')"></button>`+PAL.map(c=>`<button class="dot ${q.color===c?'sel':''}" style="background:${c}" title="${esc(S.colors[c]||'Color sin cliente asignado')}" ${q.locked?'disabled':''} onclick="setCol('${c}')"></button>`).join('')+
(q.color?`<input style="max-width:200px" placeholder="Cliente de este color" value="${esc(S.colors[q.color]||'')}" ${q.locked?'disabled':''} oninput="S.colors[cur.color]=this.value;save()">`:'')+`</div>`}
function setCol(c){cur.color=c;const y=window.scrollY;rEdit();window.scrollTo(0,y)}
function rEdit(){const q=cur,d=q.locked?'disabled':'';
$('#app').innerHTML=`<div class="bar"><h2 style="margin:0">${pad(q.num)}</h2>${q.saved?'<span class="badge">'+(q.sold?'Vendida':'Sin vender')+'</span>':''}<span class="sp"></span>
${q.locked?'<button class="btn" onclick="cur.locked=false;rEdit()">Editar</button>':'<button class="btn" onclick="saveQ()">Guardar cotización</button>'}
<button class="btn ghost" onclick="print()">Imprimir</button></div>
<div class="sheet"><div class="row"><div><label>Número</label><input value="${pad(q.num)}" disabled></div>
<div><label>Fecha</label><input type="date" ${d} value="${q.date}" oninput="cur.date=this.value"></div>
<div><label>Vigencia</label><input ${d} value="${esc(q.vig)}" oninput="cur.vig=this.value"></div>
<div><label>Color del cliente</label>${dotsEdit(q)}</div></div>
<div class="row"><div><label>Para quién va (cliente / empresa)</label><input ${d} value="${esc(q.para)}" placeholder="Nombre del cliente" oninput="cur.para=this.value"></div>
<div><label>Para dónde va (dirección de entrega)</label><textarea ${d} placeholder="Calle, número, ciudad, CP" oninput="cur.dest=this.value">${esc(q.dest)}</textarea></div></div>
<div class="tw"><table><thead><tr><th style="width:22%">Producto</th><th>Especificaciones</th><th style="width:70px">Cant.</th><th style="width:110px">Costo unit.</th><th style="width:82px">Moneda</th><th style="width:120px;text-align:right">Importe</th><th style="width:34px"></th></tr></thead><tbody id="rows"></tbody></table></div>
${q.locked?'':'<button class="btn ghost sm" onclick="addRow()">+ Agregar producto</button>'}
<div class="row" style="margin-top:18px"><div><label>Costo de envío</label><div style="display:flex;gap:6px"><input type="number" min="0" step="any" ${d} value="${q.envio}" oninput="cur.envio=this.value;tot()"><select style="max-width:90px" ${d} onchange="cur.envioCur=this.value;tot()"><option ${q.envioCur==='MXN'?'selected':''}>MXN</option><option ${q.envioCur==='USD'?'selected':''}>USD</option></select></div></div>
<div><label>IVA (%)</label><input type="number" min="0" step="any" ${d} value="${q.iva}" oninput="cur.iva=this.value;tot()"></div>
<div><label>Tipo de cambio (MXN por 1 USD)</label><input type="number" min="0" step="any" ${d} value="${q.tc}" oninput="cur.tc=+this.value||1;S.tc=cur.tc;save();tot()"></div>
<div><label>Mostrar totales en</label><select ${d} onchange="cur.disp=this.value;rEdit()"><option ${q.disp==='MXN'?'selected':''}>MXN</option><option ${q.disp==='USD'?'selected':''}>USD</option></select></div></div>
<div class="row"><div><label>Condiciones de pago</label><input ${d} value="${esc(q.pago)}" placeholder="Ej. 50% anticipo, 50% contra entrega" oninput="cur.pago=this.value"></div>
<div><label>Tiempo de entrega</label><input ${d} value="${esc(q.entrega)}" placeholder="Ej. 5 días hábiles" oninput="cur.entrega=this.value"></div></div>
<div><label>Notas y especificaciones adicionales</label><textarea ${d} oninput="cur.notas=this.value">${esc(q.notas)}</textarea></div>
<div class="tot" id="tot"></div><div id="conv" style="text-align:right"></div></div>`;rows();tot()}
function rows(){$('#rows').innerHTML=cur.items.map((i,n)=>{const d=cur.locked?'disabled':'';return `<tr><td><input ${d} value="${esc(i.name)}" placeholder="Producto" oninput="up(${n},'name',this.value)"></td>
<td><textarea ${d} style="min-height:38px" placeholder="Medidas, material, marca…" oninput="up(${n},'spec',this.value)">${esc(i.spec)}</textarea></td>
<td><input type="number" min="0" step="any" ${d} value="${i.qty}" oninput="up(${n},'qty',this.value)"></td>
<td><input type="number" min="0" step="any" ${d} value="${i.cost}" oninput="up(${n},'cost',this.value)"></td>
<td><select ${d} onchange="up(${n},'cur',this.value)"><option ${i.cur==='MXN'?'selected':''}>MXN</option><option ${i.cur==='USD'?'selected':''}>USD</option></select></td>
<td class="ro" style="text-align:right" id="im${n}"></td><td>${cur.locked?'':`<button class="x" title="Quitar" onclick="delRow(${n})">×</button>`}</td></tr>`}).join('');cur.items.forEach((_,n)=>imp(n))}
function imp(n){const i=cur.items[n],e=$('#im'+n);if(e)e.textContent=fm(conv(i.cost,i.cur,cur)*(+i.qty||0),cur.disp)}
function up(n,k,v){cur.items[n][k]=v;if(k==='cur'||k==='cost'||k==='qty')imp(n);tot()}
function addRow(){cur.items.push({name:'',spec:'',qty:1,cost:0,cur:'MXN'});rows();tot()}
function delRow(n){if(cur.items.length>1)cur.items.splice(n,1);rows();tot()}
function tot(){const c=calc(cur),D=cur.disp;cur.items.forEach((_,n)=>imp(n));
$('#tot').innerHTML=`<div><span>Subtotal</span><span>${fm(c.sub,D)}</span></div><div><span>Envío</span><span>${fm(c.env,D)}</span></div><div><span>IVA ${cur.iva||0}%</span><span>${fm(c.iva,D)}</span></div><div class="g"><span>Total</span><span>${fm(c.tot,D)}</span></div>`;
$('#conv').innerHTML=c.cv?`<span class="note">Se aplicó conversión ${D==='USD'?'de pesos (MXN) a dólares (USD)':'de dólares (USD) a pesos (MXN)'} · TC ${cur.tc} MXN por USD</span>`:''}
async function saveQ(){const q=cur;if(!q.para.trim()){alert('Escribe para quién va la cotización.');return}
try{if(!q.saved){await fdb.runTransaction(async t=>{const m=await t.get(metaRef);const n=(m.exists&&m.data().seq)||1;q.num=n;t.set(metaRef,{seq:n+1},{merge:true});t.set(qCol.doc(String(q.id)),Object.assign({},q,{saved:true,locked:false}))})}
else await qCol.doc(String(q.id)).set(Object.assign({},q,{saved:true,locked:false}));
q.saved=true;q.locked=true;rEdit()}catch(e){alert('No se pudo guardar. Revisa tu conexión e inténtalo de nuevo.')}}
function rSold(){const L=S.quotes.filter(q=>flt==='all'||(flt==='sold')===q.sold).sort((a,b)=>b.num-a.num);
$('#app').innerHTML=`<h2>Cotizaciones vendidas</h2><div class="bar">${[['all','Todas'],['sold','Vendidas'],['open','Sin vender']].map(([k,t])=>`<button class="btn sm ${flt===k?'':'ghost'}" onclick="flt='${k}';rSold()">${t}</button>`).join('')}</div>
<div class="list">${L.length?L.map(q=>{const c=calc(q);return `<div class="it ${q.sold?'sold':''}"><button class="chk ${q.sold?'on':''}" title="${q.sold?'Quitar marca de vendida':'Marcar como vendida'}" onclick="tg(${q.id})">✓</button>
<span class="dot ${q.color?'':'none'}" style="background:${q.color||'transparent'}" onclick="tip(event,'${q.color}')"></span>
<div class="mid"><b>${pad(q.num)}</b> · ${esc(q.para)}<br><small>${q.date} · ${fm(c.tot,q.disp)}</small></div><span class="badge ${q.sold?'ok':''}">${q.sold?'Vendida':'Sin vender'}</span>
<button class="btn sm ghost" onclick="go('edit',${q.id})">Abrir</button><button class="x" title="Eliminar" onclick="del(${q.id})">×</button></div>`}).join(''):'<div class="empty">Aún no hay cotizaciones aquí. Crea la primera desde “Nueva cotización”.</div>'}</div>`}
function tg(id){const q=S.quotes.find(x=>x.id===id);qCol.doc(String(id)).update({sold:!q.sold})}
function del(id){if(confirm('¿Eliminar esta cotización? No se puede deshacer.'))qCol.doc(String(id)).delete()}
function rInv(){const q=inv.q.toLowerCase();let R=[];S.quotes.forEach(x=>x.items.forEach(i=>R.push({x,i})));
R.sort((a,b)=>a.x.date.localeCompare(b.x.date)||a.x.num-b.x.num);
R=R.filter(({x,i})=>(!inv.c||x.color===inv.c)&&(!q||pad(x.num).toLowerCase().includes(q)||String(x.num)===q||(x.para+i.name).toLowerCase().includes(q)));
$('#app').innerHTML=`<h2>Inventario de lo cotizado</h2><div class="bar"><input style="max-width:280px" placeholder="Buscar número de cotización…" value="${esc(inv.q)}" oninput="inv.q=this.value;rInv(1)" id="sq">
<div class="dots"><span style="color:var(--mut);font-size:13px">Cliente:</span><button class="dot none ${!inv.c?'sel':''}" title="Todos" onclick="inv.c='';rInv()"></button>${PAL.map(c=>`<button class="dot ${inv.c===c?'sel':''}" style="background:${c}" onclick="tip(event,'${c}');inv.c=inv.c==='${c}'?'':'${c}';rInv()" title="${esc(S.colors[c]||'Sin cliente asignado')}"></button>`).join('')}</div></div>
<div class="sheet"><div class="tw"><table><thead><tr><th>Fecha</th><th>Cotización</th><th>Cliente</th><th>Producto</th><th>Cant.</th><th style="text-align:right">Costo unit.</th><th>Estado</th></tr></thead><tbody>
${R.map(({x,i})=>`<tr><td class="ro">${x.date}</td><td class="ro"><a href="#" style="color:var(--acc)" onclick="go('edit',${x.id});return false">${pad(x.num)}</a></td>
<td class="ro"><span class="dot ${x.color?'':'none'}" style="background:${x.color||'transparent'}" onclick="tip(event,'${x.color}')"></span> ${esc(x.para)}</td><td class="ro">${esc(i.name)}</td><td class="ro">${i.qty}</td><td class="ro" style="text-align:right">${fm(i.cost,i.cur)}</td><td class="ro">${x.sold?'Vendida':'Sin vender'}</td></tr>`).join('')}</tbody></table></div>
${R.length?'':'<div class="empty">No hay resultados.</div>'}</div>`;
if(arguments[0]){const e=$('#sq');e.focus();e.setSelectionRange(e.value.length,e.value.length)}}
let tt;function tip(e,c){e.stopPropagation();const t=$('#tip');t.textContent=c?(S.colors[c]?'Cliente: '+S.colors[c]:'Color sin cliente asignado (asígnalo en la cotización)'):'Sin color asignado';
t.style.display='block';t.style.left=Math.min(e.clientX+10,innerWidth-230)+'px';t.style.top=(e.clientY+14)+'px';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',2200)}
function backup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='respaldo-cotistock.json';a.click()}
